openapi: 3.0.3
info:
  title: Contrat — Épreuve finale KFOKAM48
  version: "1.2"
  description: |
    Les cinq opérations imposées (annexe B) sont implémentées EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur {code, message}.

    Version 1.2 (étape 3 — enveloppe) : chaque exercice est relu par DEUX relecteurs
    différents ; la note retenue est la moyenne des deux. Si un seul a rendu, la note
    est affichée mais marquée PROVISOIRE (statut d'exercice PROVISOIRE, puis RELEVE
    quand les deux ont rendu).

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  titre: { type: string }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
                  clotee: { type: boolean }
        "400": { $ref: "#/components/responses/Erreur" }   # champ manquant

    get:
      summary: Lister les sessions d'une promotion
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, titre, code, ouvertureAt, expirationAt, clotee]
                  properties:
                    id: { type: integer, format: int64 }
                    titre: { type: string }
                    code: { type: string }
                    ouvertureAt: { type: string, format: date-time }
                    expirationAt: { type: string, format: date-time }
                    clotee: { type: boolean }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions/{id}/cloture:
    post:
      summary: Le formateur clôture une session (plus de dépôts ni de présence ensuite, Q12)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Session clôturée }
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_CLOTUREE

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU · ETUDIANT_BLOQUE (Q4)
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE (RG1)

    get:
      summary: Voir les présences d'une session
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des présences
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, sessionId, etudiantId, source]
                  properties:
                    id: { type: integer, format: int64 }
                    sessionId: { type: integer, format: int64 }
                    etudiantId: { type: integer, format: int64 }
                    source: { type: string, enum: [ETUDIANT, FORMATEUR] }

  /api/presences/manual:
    post:
      summary: Le formateur ajoute une présence à la main (source=FORMATEUR, Q14)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée manuellement
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [FORMATEUR] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE · ETUDIANT_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT · SESSION_CLOTUREE

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string, enum: [EN_ATTENTE] }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE · SESSION_CLOTUREE

    get:
      summary: Lister les exercices d'une session ou d'un étudiant
      parameters:
        - name: sessionId
          in: query
          schema: { type: integer, format: int64 }
        - name: etudiantId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des exercices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Exercice"

  /api/exercices/{id}:
    put:
      summary: Remplacer le lien d'un exercice (tant que personne n'a relu, Q13)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercice"
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEBUTEE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

    get:
      summary: Récupérer un exercice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: L'exercice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exercice"
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU

  /api/relectures/{exerciceId}/assignation:
    post:
      summary: >
        Assigner un relecteur à un exercice. Sans corps, le choix est aléatoire
        parmi les étudiants présents, l'auteur et les relecteurs déjà assignés exclus
        (Q6/Q7 adaptés par l'enveloppe : DEUX relecteurs par exercice).
      parameters:
        - name: exerciceId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                relecteurId: { type: integer, format: int64, nullable: true }
      responses:
        "201":
          description: Relecture assignée (note encore null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relecture"
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE (Q5)
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTEUR_DEJA_ASSIGNE · AUCUN_RELECTEUR_DISPONIBLE

  /api/relectures/{id}:
    post:
      summary: >
        Le relecteur rend sa relecture : { note, commentaire } (contrat imposé).
        Le {id} est celui de la relecture ASSIGNÉE. Un seul des deux relecteurs
        ayant rendu => statut PROVISOIRE ; les deux ayant rendu => RELEVE.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200":
          description: Relecture enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relecture"
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE (hors 0-20 ou non entière)
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE (ce relecteur a déjà rendu)

    put:
      summary: Le relecteur corrige sa note tant que le formateur n'a pas clôturé (Q10)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200":
          description: Relecture corrigée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relecture"
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_VALIDEE (session clôturée)

  /api/relectures:
    get:
      summary: Relectures d'un relecteur (à rendre et rendues) ou d'un exercice
      parameters:
        - name: relecteurId
          in: query
          schema: { type: integer, format: int64 }
        - name: exerciceId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des relectures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Relecture"

  /api/tableau:
    get:
      summary: >
        Le tableau récapitulatif du formateur. La moyenne vient de l'API (RG15) :
        depuis l'enveloppe, c'est la moyenne des notes des DEUX relecteurs ; avec une
        seule relecture rendue, la note est celle-là, avec statut provisoire.
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/promotions:
    get:
      summary: Lister les promotions (écrans de sélection)
      responses:
        "200":
          description: Liste des promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }

  /api/students:
    get:
      summary: Lister les étudiants (l'étudiant choisit son nom, Q1)
      responses:
        "200":
          description: Liste des étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom, prenom, matricule]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
                    prenom: { type: string }
                    matricule: { type: string }
                    promotionId: { type: integer, format: int64, nullable: true }

components:
  schemas:
    Exercice:
      type: object
      required: [id, sessionId, etudiantId, lien, statut]
      properties:
        id: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        etudiantId: { type: integer, format: int64 }
        lien: { type: string }
        statut:
          type: string
          enum: [EN_ATTENTE, PROVISOIRE, RELEVE, VALIDEE]
          description: >
            PROVISOIRE : un seul des deux relecteurs a rendu (note affichée mais
            provisoire). RELEVE : les deux ont rendu, note retenue = moyenne des deux.

    Relecture:
      type: object
      required: [id, exerciceId, relecteurId]
      properties:
        id: { type: integer, format: int64 }
        exerciceId: { type: integer, format: int64 }
        relecteurId: { type: integer, format: int64 }
        note: { type: integer, nullable: true, description: "null tant que le relecteur n'a pas rendu" }
        commentaire: { type: string, nullable: true }

    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception :
        { "code": "CODE_EXPIRE", "message": "Le code de présence a expiré." }
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
