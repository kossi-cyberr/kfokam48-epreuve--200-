# ------------------------------------------------------------------
# Application
# ------------------------------------------------------------------
spring.application.name=kos
server.port=${SERVER_PORT:8090}

# ------------------------------------------------------------------
# Base de données (PostgreSQL)
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kos}
spring.datasource.username=${DB_USERNAME:kos}
spring.datasource.password=${DB_PASSWORD:kos}
spring.datasource.hikari.maximum-pool-size=10

# Flyway gère le schéma, Hibernate ne fait que le valider
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ------------------------------------------------------------------
# CORS (app Next.js)
# ------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3010,http://127.0.0.1:3010}

# ------------------------------------------------------------------
# Swagger / OpenAPI
# ------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sort=method
springdoc.swagger-ui.tags-sort=alpha
springdoc.swagger-ui.use-root-path=false

# ------------------------------------------------------------------
# Actuator (santé / healthchecks Docker)
# ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
